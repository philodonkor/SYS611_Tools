<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYS 611 — Lecture Activities</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    /* ---- palette ---- */
    --navy:#0B0C10;
    --cyan:#166B8C;         /* deepened again — measured ~5.7:1 on --paper, was borderline at ~4.4:1 */
    --cyan-bright:#2BB4E0;  /* reserved for small accents on dark backgrounds only */
    --cyan-soft:#BFE3F0;
    --cyan-faint:#EAF5F9;
    --paper:#FBFAF8;
    --line:#E1DFDA;
    --line-strong:#C9C6BF;
    --ink:#15161A;
    --ink-muted:#565A62;
    --ink-faint:#696D74;    /* measured ~3.85:1 at the old value; this one clears ~5:1 on --paper */

    /* ---- fluid type scale ---- */
    --fs-micro: clamp(0.72rem, 0.70rem + 0.10vw, 0.78rem);
    --fs-xs:    clamp(0.80rem, 0.77rem + 0.14vw, 0.88rem);
    --fs-sm:    clamp(0.90rem, 0.87rem + 0.14vw, 0.98rem);
    --fs-body:  clamp(1rem, 0.97rem + 0.16vw, 1.08rem);
    --fs-h3:    clamp(1.12rem, 1.04rem + 0.36vw, 1.38rem);
    --fs-h2:    clamp(1.7rem, 1.35rem + 1.6vw, 2.7rem);
    --fs-h1:    clamp(3rem, 1.7rem + 5.6vw, 6.4rem);

    /* ---- fluid spacing ---- */
    --sp-sm: clamp(0.75rem, 0.62rem + 0.5vw, 1.1rem);
    --sp-md: clamp(1.3rem, 0.95rem + 1.5vw, 2.2rem);
    --sp-lg: clamp(2.2rem, 1.4rem + 3.2vw, 4.4rem);
    --sp-xl: clamp(3.4rem, 1.9rem + 6vw, 7rem);

    --content-max: 1240px;
    --gutter: clamp(20px, 4vw, 64px);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; font-family:'Inter',-apple-system,Helvetica,Arial,sans-serif;
    background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-size:var(--fs-body); line-height:1.5;
  }
  h1,h2,h3,p{margin:0}
  a{color:inherit}
  a:focus-visible, button:focus-visible{
    outline:2.5px solid var(--cyan); outline-offset:3px; border-radius:2px;
  }

  .shell{
    width:100%; max-width:var(--content-max); margin-inline:auto;
    padding-inline:var(--gutter);
  }

  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ---------- hero ---------- */
  .hero{
    background:var(--navy); border-bottom:1px solid var(--cyan);
    padding-block:var(--sp-xl) var(--sp-lg); position:relative; overflow:hidden;
  }
  .hero-inner{ position:relative; z-index:1; }
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap;
    gap:8px 20px; margin-bottom:var(--sp-lg);
    font-family:'IBM Plex Mono',monospace; font-size:var(--fs-micro);
    letter-spacing:0.08em; text-transform:uppercase; color:var(--cyan-bright);
  }
  .hero-kicker{
    font-family:'IBM Plex Mono',monospace; font-size:var(--fs-xs); font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--cyan-bright);
    margin-bottom:6px;
  }
  h1{
    font-family:'Newsreader',Georgia,serif; font-weight:600; font-style:normal;
    font-size:var(--fs-h1); color:#F5F4F1; line-height:0.98; letter-spacing:-0.02em;
    text-wrap:balance;
  }
  .hero-dek{
    margin-top:var(--sp-sm); color:var(--cyan-soft); font-size:var(--fs-sm);
    max-width:34ch; line-height:1.6; font-family:'Inter',sans-serif;
  }
  .hero-motif{
    position:absolute; top:0; right:0; height:100%; width:52%; opacity:0.55;
    pointer-events:none;
  }

  /* ---------- sticky unit nav ---------- */
  .unitnav-wrap{
    position:sticky; top:0; z-index:20;
    background:rgba(251,250,248,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .unitnav{
    display:flex; gap:2px; overflow-x:auto;
  }
  .unitnav a{
    font-family:'Inter',sans-serif; font-weight:600; font-size:var(--fs-xs);
    color:var(--ink-muted); text-decoration:none; white-space:nowrap;
    padding:14px 16px; border-bottom:2px solid transparent;
    display:flex; align-items:baseline; gap:7px;
    transition:color .15s ease, border-color .15s ease;
  }
  .unitnav a span.n{ font-family:'IBM Plex Mono',monospace; font-size:var(--fs-micro); color:var(--ink-faint); }
  .unitnav a:hover{ color:var(--ink); }
  .unitnav a[aria-current="location"]{ color:var(--ink); border-color:var(--cyan); }
  .unitnav a[aria-current="location"] span.n{ color:var(--cyan); }

  main{ padding-bottom:var(--sp-xl); }

  /* ---------- next-lecture strip ---------- */
  .status-strip{
    margin-top:var(--sp-md); padding:14px 18px;
    border:1px solid var(--line-strong); border-left:3px solid var(--cyan);
    background:#fff; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    font-size:var(--fs-xs);
  }
  .status-strip .tag{
    font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.07em;
    font-size:var(--fs-micro); color:var(--cyan); font-weight:600;
  }
  .status-strip .what{ color:var(--ink); font-weight:600; }
  .status-strip .when{ color:var(--ink-muted); }

  /* ---------- unit section ---------- */
  .unit{ padding-top:var(--sp-xl); scroll-margin-top:56px; }
  .unit-head{
    position:relative; padding-bottom:var(--sp-sm);
    border-bottom:1px solid var(--line-strong);
    margin-bottom:var(--sp-md); overflow:hidden;
  }
  .unit-motif{ position:absolute; top:-6%; right:-2%; height:120%; width:38%; opacity:0.5; pointer-events:none; }
  .unit-num{
    font-family:'IBM Plex Mono',monospace; font-size:var(--fs-micro); color:var(--cyan);
    letter-spacing:0.08em; text-transform:uppercase; position:relative; z-index:1;
  }
  .unit-title{
    font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:var(--fs-h2);
    color:var(--ink); margin-top:6px; position:relative; z-index:1;
    max-width:22ch; letter-spacing:-0.01em; line-height:1.05;
  }
  .unit-blurb{
    color:var(--ink-muted); font-size:clamp(1rem, 0.96rem + 0.18vw, 1.12rem); margin-top:10px; max-width:48ch;
    line-height:1.55; position:relative; z-index:1; font-style:normal; font-weight:400;
    font-family:'Newsreader',Georgia,serif;
  }

  /* ---------- week rows (editorial list, not cards) ---------- */
  .weeks{ display:flex; flex-direction:column; }
  .week{
    display:grid; grid-template-columns:6.5rem 1fr; gap:var(--sp-sm);
    padding-block:16px; border-top:1px solid var(--line);
    position:relative;
  }
  .weeks .week:last-child{ border-bottom:1px solid var(--line); }
  .week.is-now{ background:linear-gradient(90deg, var(--cyan-faint), transparent 70%); }
  .week.is-special .week-topic{ color:var(--ink-muted); }

  .now-flag{
    font-family:'IBM Plex Mono',monospace; font-size:var(--fs-micro); font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; color:var(--cyan);
    display:block; margin-bottom:3px;
  }
  .week-when{ display:flex; flex-direction:column; gap:1px; padding-top:2px; }
  .week-date{ font-family:'IBM Plex Mono',monospace; font-size:var(--fs-xs); color:var(--ink-muted); font-variant-numeric:tabular-nums; }
  .week-num{ font-family:'IBM Plex Mono',monospace; font-size:var(--fs-micro); color:var(--ink-faint); margin-top:2px; }

  .week-body{ min-width:0; }
  .week-topic{ font-size:var(--fs-h3); font-weight:600; font-family:'Inter',sans-serif; letter-spacing:-0.01em; color:var(--ink); }
  .week-sub{ font-size:var(--fs-xs); color:var(--ink-muted); margin-top:3px; }
  .week-label{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:var(--fs-micro);
    letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint);
    border:1px solid var(--line-strong); padding:2px 7px; border-radius:3px; margin-bottom:6px;
  }
  .week.is-exam .week-label{ color:#9A3B2E; border-color:#E3B3A9; }
  .week.is-off .week-label{ color:var(--ink-faint); border-color:var(--line-strong); }

  .tools{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .tool-chip{
    display:inline-flex; align-items:center; gap:9px;
    background:#fff; color:#0E5C79; text-decoration:none; border:1px solid var(--cyan-soft);
    padding:9px 14px 9px 11px; border-radius:8px;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .tool-chip:hover{ transform:translateY(-1px); box-shadow:0 4px 14px rgba(28,127,163,0.18); border-color:var(--cyan); }
  .tool-chip svg{ width:15px; height:15px; flex-shrink:0; }
  .tool-chip .tt{ display:flex; flex-direction:column; line-height:1.25; }
  .tool-chip .tt b{ font-size:var(--fs-xs); font-weight:600; font-family:'Inter',sans-serif; }
  .tool-chip .tt span{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:#3D7E9A; text-transform:uppercase; letter-spacing:0.04em; }

  footer{
    width:100%; max-width:var(--content-max); margin:0 auto;
    padding:var(--sp-lg) var(--gutter) var(--sp-lg);
    font-size:var(--fs-xs); color:var(--ink-muted); border-top:1px solid var(--line);
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    font-family:'IBM Plex Mono',monospace;
  }

  @media(max-width:640px){
    .week{ grid-template-columns:1fr; gap:4px; }
    .week-when{ flex-direction:row; align-items:baseline; gap:9px; }
    .unit-motif{ width:60%; opacity:0.22; right:-8%; }
    .unit-title{ max-width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .tool-chip{ transition:none; }
  }
</style>
</head>

<script>
  const ICONS = {

  const units = [

        { date: "2026-12-10", wk: "W13", topic: "Agent-based Simulation", sub: "Models & implementation in NetLogo", tools: [] },

  const DISPLAY_FMT = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });

  function toDate(iso){ return new Date(iso + 'T00:00:00'); }
  function displayDate(iso){ return DISPLAY_FMT.format(toDate(iso)).replace('.', ''); }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  function startOfWeek(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  const thisWeekStart = startOfWeek(today);
  const thisWeekEnd = new Date(thisWeekStart);
  thisWeekEnd.setDate(thisWeekEnd.getDate() + 7);

  const allLectures = [];
  units.forEach(unit => unit.weeks.forEach(w => allLectures.push({ unitId: unit.id, ...w, dateObj: toDate(w.date) })));
  allLectures.sort((a, b) => a.dateObj - b.dateObj);

  let currentWeekKey = null;
  let nextLecture = null;
  let courseComplete = false;

  const inThisWeek = allLectures.find(l => l.dateObj >= thisWeekStart && l.dateObj < thisWeekEnd);
  if (inThisWeek) {
    currentWeekKey = inThisWeek.unitId + inThisWeek.wk;
  } else {
    nextLecture = allLectures.find(l => l.dateObj >= thisWeekEnd);
    if (!nextLecture) {
      const last = allLectures[allLectures.length - 1];
      if (today > last.dateObj) courseComplete = true;
    }
  }

  const statusShell = document.getElementById('status-shell');
  if (currentWeekKey) {
    // handled inline via .is-now on the week row itself; no separate strip needed
  } else if (nextLecture) {
    statusShell.innerHTML = `
      <div class="status-strip">
        <span class="tag">Next lecture</span>
        <span class="what">${nextLecture.topic}</span>
        <span class="when">${displayDate(nextLecture.date)} · ${nextLecture.wk}</span>
      </div>`;
  } else if (courseComplete) {
    statusShell.innerHTML = `
      <div class="status-strip">
        <span class="tag">Course complete</span>
        <span class="what">All lectures for Fall 2026 have concluded.</span>
      </div>`;
  }

  const nav = document.getElementById('unitnav');
  const main = document.getElementById('main');

  units.forEach(unit => {
    nav.insertAdjacentHTML('beforeend',
      `<a href="#${unit.id}" data-unit="${unit.id}"><span class="n">${unit.num.replace('Unit ', '')}</span>${unit.nav}</a>`);

    const section = document.createElement('section');
    section.className = 'unit';
    section.id = unit.id;

    const weekRows = unit.weeks.map(w => {
      const isNow = (unit.id + w.wk) === currentWeekKey;
      const specialClass = w.special === 'exam' ? ' is-special is-exam'
        : w.special === 'off' ? ' is-special is-off'
        : '';
      const toolsHtml = w.tools.length
        ? `<div class="tools">${w.tools.map(t => `
            <a class="tool-chip" href="${t.href}" target="_blank" rel="noopener noreferrer">
              ${ICONS[t.icon] || ICONS.default}
              <span class="tt"><b>${t.name}</b><span>${t.type}</span></span>
            </a>`).join('')}</div>`
        : '';

      const labelHtml = w.special === 'exam' ? `<span class="week-label">Exam</span><br>`
        : w.special === 'off' ? `<span class="week-label">No class</span><br>` : '';

      return `
        <article class="week${isNow ? ' is-now' : ''}${specialClass}">
          <div class="week-when">
            ${isNow ? '<span class="now-flag">This week</span>' : ''}
            <time class="week-date" datetime="${w.date}">${displayDate(w.date)}</time>
            ${w.wk !== '\u2014' ? `<span class="week-num">${w.wk}</span>` : ''}
          </div>
          <div class="week-body">
            ${labelHtml}
            <h3 class="week-topic">${w.topic}</h3>
            <p class="week-sub">${w.sub}</p>
            ${toolsHtml}
          </div>
        </article>`;
    }).join('');

    section.innerHTML = `
      <div class="shell">
        <header class="unit-head">
          ${MOTIFS[unit.motif]}
          <p class="unit-num">${unit.num}</p>
          <h2 class="unit-title">${unit.title}</h2>
          <p class="unit-blurb">${unit.blurb}</p>
        </header>
        <div class="weeks">${weekRows}</div>
      </div>
    `;
    main.appendChild(section);
  });

  const navLinks = Array.from(nav.querySelectorAll('a[data-unit]'));
  const sections = units.map(u => document.getElementById(u.id));

  function setActiveNav(id) {
    navLinks.forEach(link => {
      if (link.dataset.unit === id) link.setAttribute('aria-current', 'location');
      else link.removeAttribute('aria-current');
    });
  }

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting);
      if (visible.length) {
        visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        setActiveNav(visible[0].target.id);
      }
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });

    sections.forEach(s => observer.observe(s));
  } else {
    if (currentWeekKey) {
      const owningUnit = units.find(u => u.weeks.some(w => (u.id + w.wk) === currentWeekKey));
      if (owningUnit) setActiveNav(owningUnit.id);
    }
  }
</script>
</body>
</html>
